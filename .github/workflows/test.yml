name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# supersede in-flight PR runs, but never cancel a master run mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # decap-cms is a real dependency here: admin-config resolves its bundle out of
      # node_modules, and one test asserts that resolution still lands on a file
      - run: bun install --frozen-lockfile=false

      - run: bun test
